[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlp-workstation"
version = "1.0.0"
description = "Supercharged automated terminal workstation for yt-dlp with clipboard detection, Spotify downloading, and single-key quality picker."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Realwaan" }
]
keywords = [
    "yt-dlp",
    "video-downloader",
    "spotify-downloader",
    "youtube-downloader",
    "media-downloader",
    "terminal",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities"
]
dependencies = [
    "colorama>=0.4.6",
    "pyperclip>=1.8.2",
    "yt-dlp>=2024.0.0"
]

[project.urls]
Homepage = "https://github.com/Realwaan/ytdlp-workstation"
Repository = "https://github.com/Realwaan/ytdlp-workstation.git"
Issues = "https://github.com/Realwaan/ytdlp-workstation/issues"

[project.scripts]
ytdlp-workstation = "auto_downloader:main"
ytdlp-ws = "auto_downloader:main"

[tool.setuptools]
py-modules = ["auto_downloader", "ytdlp_workstation"]
