[package]
name = "ytdlp_rust_core"
version = "0.2.0"
edition = "2021"
description = "Native Rust performance core for YT-DLP Workstation (MP4 box scanner, coalesced fragment merger, Tokio HTTP/2 HLS Turbo engine, parallel web media sniffer, DFA URL & progress parsers, and O(1) archive loader)."
license = "MIT"

[lib]
name = "ytdlp_rust_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py38", "generate-import-lib"] }
bytes = "1.7"
memchr = "2.7"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "http2", "gzip", "deflate", "charset", "stream"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
